name: Validate and build growth equity bundles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/earnings-analysis/tests -v
      - run: python skills/earnings-analysis/tools/check_package.py
      - run: python tools/build_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: growth-equity-skills
          path: dist/*.zip
          if-no-files-found: error
